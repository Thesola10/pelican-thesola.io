{% extends "base.html" %}

{% block title %}{{ SITENAME }} | Categories{% endblock %}
{% block content %}

    <h1>Categories</h1>

    <ul>
    {% for category, articles in categories|sort %}
        <li class="card"><a href="{{SITEURL}}/{{category.url}}">{{ category }}</a> ({{ articles|count}})</li>
    {% endfor %}
    </ul>

{% endblock %}
